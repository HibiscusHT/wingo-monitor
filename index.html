<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 mb-4">Reports</h1>
    <p id="load-error" class="alert alert-danger" role="alert" hidden>
      Data laporan gagal dimuat. Silakan muat ulang halaman.
    </p>
    <table id="reports-table" class="table table-striped table-bordered" style="width: 100%">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Periode</th>
          <th scope="col">Pola</th>
          <th scope="col">Bid</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
    </table>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(function () {
      $('#reports-table').DataTable({
        ajax: function (_request, callback) {
          $.ajax({
            url: 'https://6ae85d441a7b15aaa50efdec.mockapi.io/game/v1/recorders',
            type: 'GET',
            headers: {
              'Content-Type': 'application/json'
            },
            dataType: 'json'
          })
            .done(function (data) {
              callback({ data: data });
            })
            .fail(function () {
              $('#load-error').prop('hidden', false);
            });
        },
        columns: [
          { data: 'id', defaultContent: '' },
          { data: 'periode', defaultContent: '' },
          { data: 'pola', defaultContent: '' },
          { data: 'bid', defaultContent: '' },
          { data: 'status', defaultContent: '' }
        ],
        order: [0,"asc"],
        pageLength: 10,
        lengthChange: false,
        paging: true,
        searching: true,
        ordering: true
      });
    });
  </script>
</body>
</html>
